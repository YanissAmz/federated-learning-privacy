[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "federated-learning-privacy"
version = "0.1.0"
description = "Federated learning with privacy attack demonstration (Deep Leakage from Gradients) and differential privacy defense, with interactive Gradio interface."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yaniss Amazouz", email = "yaniss91600@gmail.com" }]
keywords = ["federated-learning", "privacy", "differential-privacy", "gradient-attack", "deep-leakage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "gradio>=4.20",
    "pyyaml>=6.0",
    "imageio>=2.34",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/YanissAmz/federated-learning-privacy"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3: math notation in code/strings/comments uses Unicode chars
# (ε, σ, δ, ≥, ≈, ×, …). They are a feature of the docstrings, not a typo.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
