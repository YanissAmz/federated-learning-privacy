# Federated Learning configuration

fl:
  num_clients: 5
  num_rounds: 20
  fraction_fit: 1.0  # fraction of clients per round
  local_epochs: 3
  batch_size: 64
  learning_rate: 0.01

model:
  name: "cnn"  # cnn | resnet18
  num_classes: 10

dataset:
  name: "cifar10"  # cifar10 | mnist
  iid: true  # true = IID split, false = non-IID
  alpha: 0.5  # Dirichlet alpha for non-IID (lower = more heterogeneous)

attack:
  name: "dlg"  # Deep Leakage from Gradients
  iterations: 300
  learning_rate: 1.0
  tv_weight: 0.001  # total variation regularization

defense:
  name: "dp"  # differential privacy
  noise_multiplier: 1.0
  max_grad_norm: 1.0  # clipping threshold
  target_epsilon: 8.0
  target_delta: 1.0e-5

demo:
  server_port: 7860
